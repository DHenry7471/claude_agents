name: Repo Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build (bundle-prompts + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp/pnpm-lock.yaml

      - name: Install deps and build
        run: cd mcp && pnpm install --frozen-lockfile && pnpm run build

  test:
    name: Test (mcp/src unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp/pnpm-lock.yaml

      - name: Install deps and test
        run: cd mcp && pnpm install --frozen-lockfile && pnpm run test

  lint-agents:
    name: Lint agent frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint agents
        run: node scripts/lint-agents.mjs
